services:
  zap:
    image: zaproxy/zap-stable
    container_name: zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8090:8080"
    networks:
      - devsecops-net
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - devsecops-net
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=devsecops_dashboard
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      # postgres:18+ images store data at /var/lib/postgresql (not .../data)
      # to support pg_ctlcluster-style major-version directories — see
      # https://github.com/docker-library/postgres/pull/1259.
      - pgdata:/var/lib/postgresql
      # Runs automatically on first container start (empty data dir) — creates
      # the scan_findings table so the app/Grafana have something to connect to.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - devsecops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d devsecops_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: .
    container_name: backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=devsecops_dashboard
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - ZAP_BASE_URL=http://zap:8080
    ports:
      - "8091:8081"
    depends_on:
      postgres:
        condition: service_healthy
      zap:
        condition: service_started
    networks:
      - devsecops-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3011:3000"
    environment:
      # Password for the Grafana "admin" web UI login (not related to Postgres).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read by grafana/provisioning/datasources/postgres.yml to reach the
      # dockerized Postgres service (same devsecops-net network).
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devsecops-net
    restart: unless-stopped

networks:
  devsecops-net:
    name: devsecops-net

volumes:
  grafana-data:
  pgdata:
