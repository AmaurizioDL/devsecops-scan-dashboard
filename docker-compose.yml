services:
  zap:
    image: zaproxy/zap-stable
    container_name: zap
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    networks:
      - devsecops-net
    restart: unless-stopped

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    ports:
      - "3000:3000"
    networks:
      - devsecops-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      # Password for the Grafana "admin" web UI login (not related to Postgres).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Read by grafana/provisioning/datasources/postgres.yml to reach the native
      # Windows Postgres instance — same credential the backend uses (see .env.example).
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - devsecops-net
    restart: unless-stopped
    # Postgres runs natively on the Windows host, not in this compose file —
    # host.docker.internal is how Docker Desktop lets containers reach it.
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  devsecops-net:
    name: devsecops-net

volumes:
  grafana-data:
