server {
    listen 80;
    root /usr/share/nginx/html;

    # Same-origin API: the browser calls /api/..., nginx forwards it to the backend
    # container on the compose network, so the backend needs no CORS config.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Written at container start from env vars; never cache it, so a changed setting
    # applies on the next page load.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
