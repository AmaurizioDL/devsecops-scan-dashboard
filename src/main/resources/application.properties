spring.application.name=dashboard
server.port=8081

# PostgreSQL (credenciales via variables de entorno, ver .env.example)
spring.datasource.url=jdbc:postgresql://localhost:5432/devsecops_dashboard
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: la tabla scan_findings ya existe, no queremos que Hibernate la genere/altere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OWASP ZAP API (contenedor "zap", expuesto en localhost:8080 sin auth por ahora)
zap.api.base-url=http://localhost:8080
zap.api.key=

# Polling del estado del spider/active scan mientras corre runFullScan
zap.scan.poll-interval-ms=2000
zap.scan.max-wait-ms=1200000
