spring.application.name=dashboard
server.port=8081

# PostgreSQL (credenciales via variables de entorno, ver .env.example).
# Defaults asumen ejecucion fuera de docker compose (IDE/mvn spring-boot:run)
# contra el Postgres dockerizado con su puerto publicado en localhost:5432.
# El servicio "backend" en docker-compose.yml sobreescribe DB_HOST=postgres
# para resolverlo por nombre de contenedor en la red devsecops-net.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devsecops_dashboard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA: la tabla scan_findings ya existe, no queremos que Hibernate la genere/altere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OWASP ZAP API. Default asume ejecucion fuera de docker compose (puerto
# publicado en localhost:8080); el servicio "backend" sobreescribe
# ZAP_BASE_URL=http://zap:8080 para resolverlo por nombre de contenedor.
zap.api.base-url=${ZAP_BASE_URL:http://localhost:8080}
zap.api.key=

# Polling del estado del spider/active scan mientras corre runFullScan
zap.scan.poll-interval-ms=2000
zap.scan.max-wait-ms=1200000
