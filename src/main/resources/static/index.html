<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevSecOps Scan Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    max-width: 720px;
    margin: 3rem auto;
    padding: 0 1.5rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: #888; margin-top: 0; }
  fieldset { border: 1px solid #8883; border-radius: 8px; padding: 1rem 1.25rem; margin: 1.5rem 0; }
  label { display: block; margin: 0.5rem 0; }
  input[type="text"] { width: 100%; padding: 0.5rem; box-sizing: border-box; font-size: 1rem; }
  .risk-levels { display: flex; gap: 1.5rem; margin-top: 0.5rem; }
  .risk-levels label { display: flex; align-items: center; gap: 0.4rem; margin: 0; }
  .actions { display: flex; gap: 0.75rem; align-items: center; }
  button {
    padding: 0.6rem 1.4rem;
    font-size: 1rem;
    border-radius: 6px;
    border: none;
    background: #2f6feb;
    color: white;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  button#stop-btn { background: #d1394a; }
  #status { margin-top: 1rem; font-weight: 600; }
  #progress-section { margin-top: 1rem; }
  #scan-progress { width: 100%; height: 1.1rem; }
  #progress-info { margin-top: 0.4rem; color: #888; font-size: 0.9rem; }
  pre#result {
    background: #8881;
    border-radius: 8px;
    padding: 1rem;
    overflow-x: auto;
    max-height: 400px;
    font-size: 0.85rem;
  }
  .links { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #8883; }
  .links a { color: #2f6feb; }
</style>
</head>
<body>

<h1>DevSecOps Scan Dashboard</h1>
<p class="sub">Trigger an OWASP ZAP spider + active scan and store the findings in Postgres.</p>

<form id="scan-form">
  <label for="targetUrl">Target URL</label>
  <input type="text" id="targetUrl" name="targetUrl" placeholder="http://juice-shop:3000" required>

  <fieldset>
    <legend>Risk levels to scan (leave all unchecked for full coverage)</legend>
    <div class="risk-levels">
      <label><input type="checkbox" name="riskLevel" value="HIGH"> HIGH</label>
      <label><input type="checkbox" name="riskLevel" value="MEDIUM"> MEDIUM</label>
      <label><input type="checkbox" name="riskLevel" value="LOW"> LOW</label>
    </div>
  </fieldset>

  <div class="actions">
    <button type="submit" id="submit-btn">Run scan</button>
    <button type="button" id="stop-btn" hidden>Detener scan</button>
  </div>
</form>

<div id="status"></div>
<div id="progress-section" hidden>
  <progress id="scan-progress" value="0" max="100"></progress>
  <div id="progress-info"></div>
</div>
<pre id="result" hidden></pre>

<div class="links">
  <a href="http://localhost:3001/d/devsecops-scan-findings" target="_blank" rel="noopener">
    Open Grafana dashboard &rarr;
  </a>
  <br>
  <a href="/api/findings" target="_blank" rel="noopener">View raw findings (JSON) &rarr;</a>
</div>

<script>
const form = document.getElementById('scan-form');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');
const submitBtn = document.getElementById('submit-btn');
const stopBtn = document.getElementById('stop-btn');
const progressSection = document.getElementById('progress-section');
const progressBar = document.getElementById('scan-progress');
const progressInfo = document.getElementById('progress-info');

const PHASE_LABELS = {
  SPIDER: 'Fase 1/2 — Rastreo (spider)',
  ACTIVE_SCAN: 'Fase 2/2 — Escaneo activo',
};

let pollHandle = null;
let currentScanId = null;

function formatDuration(totalSeconds) {
  if (totalSeconds === null || totalSeconds === undefined) {
    return 'calculando…';
  }
  const seconds = Math.max(0, Math.round(totalSeconds));
  const mm = Math.floor(seconds / 60);
  const ss = seconds % 60;
  return `${mm}:${String(ss).padStart(2, '0')}`;
}

function stopPolling() {
  if (pollHandle) {
    clearInterval(pollHandle);
    pollHandle = null;
  }
}

function resetForNextScan() {
  stopPolling();
  currentScanId = null;
  submitBtn.disabled = false;
  stopBtn.hidden = true;
  stopBtn.disabled = false;
  progressSection.hidden = true;
}

function renderRunningState(run) {
  progressSection.hidden = false;
  progressBar.value = run.percent;
  const phaseLabel = PHASE_LABELS[run.phase] || run.phase;
  progressInfo.textContent =
    `${phaseLabel} — ${run.percent}% • ETA: ${formatDuration(run.etaSeconds)} • Transcurrido: ${formatDuration(run.elapsedSeconds)}`;
}

async function pollScanStatus(scanId) {
  try {
    const response = await fetch(`/api/scans/${scanId}`);
    if (!response.ok) {
      statusEl.textContent = `Error consultando el estado del scan (HTTP ${response.status})`;
      resetForNextScan();
      return;
    }
    const run = await response.json();

    if (run.phase === 'SPIDER' || run.phase === 'ACTIVE_SCAN') {
      statusEl.textContent = 'Scan en progreso…';
      renderRunningState(run);
      return;
    }

    // Terminal state: DONE, STOPPED or FAILED.
    progressSection.hidden = true;
    if (run.phase === 'DONE') {
      statusEl.textContent = `Done — ${run.findings.length} finding(s) saved in this run.`;
      resultEl.textContent = JSON.stringify(run.findings, null, 2);
      resultEl.hidden = false;
    } else if (run.phase === 'STOPPED') {
      statusEl.textContent = `Scan detenido por el usuario — ${run.findings.length} finding(s) guardado(s) antes de detenerlo.`;
      resultEl.textContent = JSON.stringify(run.findings, null, 2);
      resultEl.hidden = false;
    } else {
      statusEl.textContent = `Scan fallido: ${run.errorMessage || 'error desconocido'}`;
      resultEl.hidden = true;
    }
    resetForNextScan();
  } catch (err) {
    statusEl.textContent = `Request failed: ${err.message}`;
    resetForNextScan();
  }
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const targetUrl = document.getElementById('targetUrl').value.trim();
  const riskLevels = Array.from(form.querySelectorAll('input[name="riskLevel"]:checked'))
    .map((el) => el.value)
    .join(',');

  const params = new URLSearchParams({ targetUrl });
  if (riskLevels) {
    params.set('riskLevels', riskLevels);
  }

  submitBtn.disabled = true;
  resultEl.hidden = true;
  statusEl.textContent = 'Iniciando scan…';

  try {
    const response = await fetch(`/api/scans?${params.toString()}`, { method: 'POST' });
    const body = await response.json();

    if (!response.ok) {
      statusEl.textContent = `Error (HTTP ${response.status}) — ${body.detail || ''}`;
      submitBtn.disabled = false;
      return;
    }

    currentScanId = body.scanId;
    stopBtn.hidden = false;
    renderRunningState(body);
    pollHandle = setInterval(() => pollScanStatus(currentScanId), 1500);
  } catch (err) {
    statusEl.textContent = `Request failed: ${err.message}`;
    submitBtn.disabled = false;
  }
});

stopBtn.addEventListener('click', async () => {
  if (!currentScanId) {
    return;
  }
  stopBtn.disabled = true;
  statusEl.textContent = 'Deteniendo scan…';
  try {
    await fetch(`/api/scans/${currentScanId}/stop`, { method: 'POST' });
  } catch (err) {
    statusEl.textContent = `No se pudo detener el scan: ${err.message}`;
    stopBtn.disabled = false;
  }
});
</script>

</body>
</html>
