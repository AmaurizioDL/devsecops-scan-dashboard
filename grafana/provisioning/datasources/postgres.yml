apiVersion: 1

datasources:
  - name: DevSecOps Dashboard Postgres
    uid: devsecops-postgres
    type: postgres
    access: proxy
    # "postgres" is the container_name of the postgres service in
    # docker-compose.yml, resolved via the shared devsecops-net network.
    url: postgres:5432
    database: devsecops_dashboard
    user: ${DB_USERNAME}
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
    secureJsonData:
      # Expanded from the DB_USERNAME/DB_PASSWORD env vars set on the grafana
      # container (see docker-compose.yml / .env.example).
      password: ${DB_PASSWORD}
