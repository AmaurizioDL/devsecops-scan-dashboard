apiVersion: 1

datasources:
  - name: DevSecOps Dashboard Postgres
    uid: devsecops-postgres
    type: postgres
    access: proxy
    url: host.docker.internal:5432
    database: devsecops_dashboard
    user: postgres
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
    secureJsonData:
      # Expanded from the DB_PASSWORD env var set on the grafana container
      # (see docker-compose.yml / .env.example).
      password: ${DB_PASSWORD}
